<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IMT Transportadora</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="#inicio"><img src="logo.png" alt="IMT Transportadora"></a><nav><a href="#inicio">Início</a><a href="#servicos">Serviços</a><a href="#contratos">Contratos</a><a href="#precos">Tabela de Preços</a><a href="#sobre">Sobre Nós</a><a href="#ouvidoria">Ouvidoria</a><button id="loginBtn" class="outline">Área do Funcionário</button></nav><button id="menuBtn" class="menu">☰</button></header>
<main id="app"></main>
<footer><img src="logo.png"><span>© <span id="year"></span> IMT Transportadora. Todos os direitos reservados.</span></footer>
<div id="radioBar" class="radio-bar"><div><span class="live-dot"></span><b id="radioName">Rádio IMT</b><small id="radioStatus">Rádio desligada</small></div><button id="radioPlay" class="radio-btn">▶</button><audio id="radioAudio" preload="none"></audio></div>
<div id="loginModal" class="modal hidden"><div class="modal-box"><button class="x" id="closeLogin">×</button><h2>Área do Funcionário</h2><p>Entre com seu acesso autorizado ou solicite um cadastro.</p><form id="loginForm" class="form"><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Senha" required><button class="btn">Entrar</button><span id="loginMsg"></span></form><hr><h3>Solicitar acesso</h3><form id="registerForm" class="form"><input name="name" placeholder="Nome completo" required><input name="email" type="email" placeholder="E-mail" required><input name="password" type="password" placeholder="Senha" minlength="6" required><button class="btn ghost">Enviar solicitação</button><span id="registerMsg"></span></form></div></div>
<div id="panel" class="drawer hidden"><div class="drawer-head"><div><small>PAINEL DO FUNCIONÁRIO</small><h2 id="welcome"></h2></div><button class="x" id="logout">Sair</button></div><div class="tabs" id="tabs"></div><div id="tabContent"></div></div>
<script src="app.js"></script></body></html>
